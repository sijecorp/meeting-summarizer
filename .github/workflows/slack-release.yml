# A release in a Slack channel, since colleagues without access to this private repository cannot
# download from the release: a card in the app's accent color, the two installers right below it, and
# the release notes in the card's thread. The build workflow calls this once a tag's release is out.
# To send a release again: Actions > slack-release > Run workflow, with its tag.
# Repository secrets: SLACK_BOT_TOKEN, a Slack app's bot token with chat:write and files:write whose
# bot is in the channel, and SLACK_CHANNEL_ID. Without them this only warns.
name: slack-release

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v1.0.3
        type: string
        required: true

permissions:
  contents: read

jobs:
  slack:
    runs-on: ubuntu-latest
    steps:
      - name: Download the installers
        id: slack
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          if [ -z "$SLACK_BOT_TOKEN" ] || [ -z "$SLACK_CHANNEL_ID" ]; then
            echo "::warning::SLACK_BOT_TOKEN or SLACK_CHANNEL_ID is not set, so Slack was not notified"
            exit 0
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir installers --pattern '*.dmg' --pattern '*-setup.exe'
          ls -l installers
          echo "dmg=$(basename installers/*.dmg)" >> "$GITHUB_OUTPUT"
          echo "exe=$(basename installers/*-setup.exe)" >> "$GITHUB_OUTPUT"

      # The card's lead is the notes' first paragraph (docs/releases/<tag>.md opens with one), left out
      # when it is a heading, as in GitHub's generated notes. shortcut: notes over 12,000 characters
      # make Slack reject the thread reply; trim them if a release ever gets that long.
      - name: Post the card and the release notes
        if: steps.slack.outputs.dmg
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          DMG: ${{ steps.slack.outputs.dmg }}
          EXE: ${{ steps.slack.outputs.exe }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          # Slack answers most errors with HTTP 200 and "ok": false.
          post() {
            curl -fsS --max-time 30 -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
              -H 'Content-Type: application/json; charset=utf-8' --data @- https://slack.com/api/chat.postMessage > res.json
            jq -e .ok res.json > /dev/null || { echo "::error::Slack chat.postMessage: $(jq -r .error res.json)"; exit 1; }
          }
          notes=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body | gsub("\r"; "")')
          jq -n --arg channel "$SLACK_CHANNEL_ID" --arg tag "$TAG" --arg notes "$notes" --arg dmg "$DMG" --arg exe "$EXE" '
            ($notes | split("\n\n")[0] | if test("^\\s*[#|]") then "" else gsub("&"; "&amp;") | gsub("<"; "&lt;") | gsub(">"; "&gt;") end) as $lead
            | {channel: $channel, unfurl_links: false, attachments: [{
                color: "#4950B0",
                fallback: "meeting-summarizer \($tag) 릴리스",
                blocks: (
                  [{type: "header", text: {type: "plain_text", text: "meeting-summarizer \($tag)"}}]
                  + (if $lead == "" then [] else [{type: "section", text: {type: "mrkdwn", text: $lead}}] end)
                  + [{type: "divider"},
                     {type: "section", fields: [
                       {type: "mrkdwn", text: "*Mac*  Apple 실리콘\n`\($dmg)`"},
                       {type: "mrkdwn", text: "*Windows*  10·11 64비트\n`\($exe)`"}]},
                     {type: "context", elements: [{type: "mrkdwn", text: "설치 파일은 바로 아래에, 바뀐 내용은 이 메시지의 스레드에 있습니다."}]}])
              }]}' | post
          ts=$(jq -r .ts res.json)
          if [ -z "$notes" ]; then echo "::warning::$TAG has no release notes"; exit 0; fi
          jq -n --arg channel "$SLACK_CHANNEL_ID" --arg ts "$ts" --arg tag "$TAG" --arg notes "$notes" '
            {channel: $channel, thread_ts: $ts, unfurl_links: false, unfurl_media: false,
             text: "meeting-summarizer \($tag) 릴리스 노트", blocks: [{type: "markdown", text: $notes}]}' | post

      - name: Upload the installers to Slack
        if: steps.slack.outputs.dmg
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          method: files.uploadV2
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel_id: ${{ secrets.SLACK_CHANNEL_ID }}
            file_uploads:
              - file: installers/${{ steps.slack.outputs.dmg }}
                filename: ${{ steps.slack.outputs.dmg }}
              - file: installers/${{ steps.slack.outputs.exe }}
                filename: ${{ steps.slack.outputs.exe }}
