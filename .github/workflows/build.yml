# Installers for internal distribution (docs/install.md): macOS Apple Silicon .dmg and Windows x64
# NSIS setup.exe, uploaded as workflow artifacts. No GitHub release is created.
name: build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # target-dir is relative to src-tauri. Windows uses D:\a\t: under src-tauri\target, the
        # nested vulkan-shaders-gen try-compile path passes MSVC's 260-character limit.
        include:
          - os: macos-latest
            name: macos-arm64
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
            target-dir: target
            installer: aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            name: windows-x64
            args: ''
            rust-targets: ''
            target-dir: ../../../t
            installer: release/bundle/nsis/*-setup.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The installer file name carries tauri.conf.json's version, so a v0.2.0 tag must build 0.2.0.
      # jq -j: no trailing newline, so no stray \r on Windows.
      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(jq -j .version src-tauri/tauri.conf.json)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match src-tauri/tauri.conf.json version $version"
            exit 1
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch, 2026-10-09
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      # Cargo, tauri-cli (cargo metadata) and tauri-action all follow CARGO_TARGET_DIR. rust-cache
      # does not, and joins an absolute target onto the workspace, hence the relative target-dir.
      - name: Short Cargo target dir
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_ENV "CARGO_TARGET_DIR=$([IO.Path]::GetFullPath("$env:GITHUB_WORKSPACE\src-tauri\${{ matrix.target-dir }}"))"

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # whisper-rs-sys does not rebuild when the GGML_* values in .cargo/config.toml change, and
          # rust-cache restores older caches by prefix. Bump this whenever those values change.
          prefix-key: v1-rust
          workspaces: src-tauri -> ${{ matrix.target-dir }}

      # whisper-rs-sys needs VULKAN_SDK (Lib\vulkan-1.lib) and glslc for the Vulkan backend
      # (architecture 5.4). 1.4.313.2 is what llama.cpp's Windows release used for the same ggml.
      - name: Install Vulkan SDK
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533 # v1.7.0
        with:
          vulkan_version: 1.4.313.2
          install_runtime: true
          cache: true
          stripdown: true

      # The app does not start without vulkan-1.dll. tauri.windows.conf.json installs this copy
      # next to the exe.
      - name: Copy vulkan-1.dll
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item "$env:VULKAN_SDK\runtime\x64\vulkan-1.dll" src-tauri\vulkan-1.dll

      # With the Visual Studio generator (VS 18 2026), ggml-vulkan's nested vulkan-shaders-gen
      # project finds no C compiler. Ninja inside the MSVC developer environment (cl.exe on PATH)
      # works for both, since the nested project inherits the generator.
      - name: MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Check cl and ninja
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Command cl, ninja | Format-Table Name, Source
          ninja --version

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          # The cmake crate reads CMAKE_GENERATOR_<target> first, so this only applies on Windows.
          CMAKE_GENERATOR_x86_64_pc_windows_msvc: Ninja
          # macOS is ad-hoc signed (bundle.macOS.signingIdentity "-"), not notarized. For Developer ID
          # signing and notarization, add these repository secrets and uncomment. APPLE_SIGNING_IDENTITY
          # overrides the "-" in tauri.conf.json.
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: ${{ matrix.args }}

      # The ggml CPU baseline (.cargo/config.toml) must reach CMake, or ggml was built for this
      # runner's CPU.
      - name: Check ggml CPU baseline
        shell: bash
        run: |
          shopt -s nullglob
          caches=(src-tauri/${{ matrix.target-dir }}/{,*/}release/build/whisper-rs-sys-*/out/build/CMakeCache.txt)
          if [ ${#caches[@]} -eq 0 ]; then echo "::error::No whisper-rs-sys CMakeCache.txt"; exit 1; fi
          for f in "${caches[@]}"; do
            echo "$f"
            grep -E '^GGML_(NATIVE|AVX2|FMA|F16C|BMI2|AVX512)[:=]' "$f" || true
            grep -q '^GGML_NATIVE:[A-Z]*=OFF' "$f" || { echo "::error::GGML_NATIVE is not OFF in $f"; exit 1; }
            grep -q '^GGML_AVX2:[A-Z]*=ON' "$f" || { echo "::error::GGML_AVX2 is not ON in $f"; exit 1; }
            grep -q '^GGML_AVX512:[A-Z]*=OFF' "$f" || { echo "::error::GGML_AVX512 is not OFF in $f"; exit 1; }
          done

      # The worker is this exe. AVX-512 from an AVX-512 runner dies on most office PCs. Today no Rust
      # dependency in the exe dispatches to AVX-512 at run time (crc32fast and simd-adler32 have such
      # code but come in only through a proc-macro). If one is added, this step fails on a good build:
      # then check only whisper-rs-sys's ggml-cpu.lib. findstr exits 1 when nothing matches, hence exit 0.
      - name: Check for AVX-512 instructions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "$env:CARGO_TARGET_DIR\release\meeting-summarizer.exe"
          if (-not (Test-Path $exe)) { echo "::error::$exe not found"; exit 1 }
          dumpbin /nologo /disasm:nobytes /out:disasm.txt $exe
          if ($LASTEXITCODE) { echo "::error::dumpbin failed"; exit 1 }
          $zmm = findstr /r "zmm[0-9]" disasm.txt
          if ($zmm) {
            $zmm | Select-Object -First 20
            echo "::error::AVX-512 (zmm) instructions in $exe"
            exit 1
          }
          exit 0

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meeting-summarizer-${{ matrix.name }}
          # Absolute on Windows: upload-artifact rejects `..` in paths.
          path: ${{ env.CARGO_TARGET_DIR || 'src-tauri/target' }}/${{ matrix.installer }}
          if-no-files-found: error
          retention-days: 30
