# Installers for internal distribution (docs/install.md): macOS Apple Silicon .dmg and Windows x64
# NSIS setup.exe, uploaded as workflow artifacts. A v* tag also gets a GitHub Release with both, once
# both builds and their checks pass (the release job).
name: build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # target-dir is relative to src-tauri. Windows uses D:\a\t: under src-tauri\target, the
        # nested vulkan-shaders-gen try-compile path passes MSVC's 260-character limit.
        include:
          - os: macos-latest
            name: macos-arm64
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
            target-dir: target
            installer: aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            name: windows-x64
            args: ''
            rust-targets: ''
            target-dir: ../../../t
            installer: release/bundle/nsis/*-setup.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The installer file name carries tauri.conf.json's version, so a v0.2.0 tag must build 0.2.0.
      # jq -j: no trailing newline, so no stray \r on Windows.
      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(jq -j .version src-tauri/tauri.conf.json)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match src-tauri/tauri.conf.json version $version"
            exit 1
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch, 2026-10-09
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      # Cargo, tauri-cli (cargo metadata) and tauri-action all follow CARGO_TARGET_DIR. rust-cache
      # does not, and joins an absolute target onto the workspace, hence the relative target-dir.
      - name: Short Cargo target dir
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_ENV "CARGO_TARGET_DIR=$([IO.Path]::GetFullPath("$env:GITHUB_WORKSPACE\src-tauri\${{ matrix.target-dir }}"))"

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # whisper-rs-sys does not rebuild when the GGML_* values in .cargo/config.toml change, and
          # rust-cache restores older caches by prefix. Bump this whenever those values change.
          prefix-key: v1-rust
          workspaces: src-tauri -> ${{ matrix.target-dir }}

      # whisper-rs-sys needs VULKAN_SDK (Lib\vulkan-1.lib) and glslc for the Vulkan backend
      # (architecture 5.4). 1.4.313.2 is what llama.cpp's Windows release used for the same ggml.
      - name: Install Vulkan SDK
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533 # v1.7.0
        with:
          vulkan_version: 1.4.313.2
          install_runtime: true
          cache: true
          stripdown: true

      # The app does not start without vulkan-1.dll. tauri.windows.conf.json installs this copy
      # next to the exe.
      - name: Copy vulkan-1.dll
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item "$env:VULKAN_SDK\runtime\x64\vulkan-1.dll" src-tauri\vulkan-1.dll

      # With the Visual Studio generator (VS 18 2026), ggml-vulkan's nested vulkan-shaders-gen
      # project finds no C compiler. Ninja inside the MSVC developer environment (cl.exe on PATH)
      # works for both, since the nested project inherits the generator.
      - name: MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Check cl and ninja
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Command cl, ninja | Format-Table Name, Source
          ninja --version

      # The llama-server sidecar (bundle.externalBin, M6.5 plan 5.1) with the same script as a local
      # build. The script caches per llama.cpp commit and CMake options; this keeps that folder between
      # runs. Windows builds inside the MSVC environment with Ninja and the Vulkan SDK set up above.
      # Saved right after the build, so a later failure does not throw a fresh build away.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: llama-server-cache
        with:
          path: ${{ runner.temp }}/llama-server
          key: llama-server-${{ runner.os }}-${{ hashFiles('scripts/llama.cpp.rev', 'scripts/llama-server.flags', 'scripts/build-llama-server.sh', 'scripts/build-llama-server.ps1') }}

      - name: Build llama-server (macOS)
        if: runner.os == 'macOS'
        env:
          MS_LLAMA_SERVER_CACHE: ${{ runner.temp }}/llama-server
        run: bash scripts/build-llama-server.sh

      - name: Build llama-server (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MS_LLAMA_SERVER_CACHE: ${{ runner.temp }}/llama-server
        run: ./scripts/build-llama-server.ps1

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.llama-server-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/llama-server
          key: ${{ steps.llama-server-cache.outputs.cache-primary-key }}

      # app-dev.ts reads the stamp the same way build.rs does; this checks it against the script's.
      - run: bun run app:dev --check

      # Tests in the same job (ENG8), after the sidecar so build.rs finds the real one. cargo test
      # builds the dev profile into the same target dir (CARGO_TARGET_DIR on Windows), which
      # rust-cache keeps; the release build below does not share or change it. Same CMake generator
      # as the build below. The test exes load vulkan-1.dll at start on Windows, and System32 has it
      # only when the Vulkan SDK installer ran (not on the action's cache hit), hence the PATH.
      - run: bun run test

      - name: cargo test
        shell: pwsh
        env:
          CMAKE_GENERATOR_x86_64_pc_windows_msvc: Ninja
        run: |
          if ($env:VULKAN_SDK) { $env:PATH = "$env:VULKAN_SDK\runtime\x64;$env:PATH" }
          cargo test --manifest-path src-tauri/Cargo.toml --locked

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          # The cmake crate reads CMAKE_GENERATOR_<target> first, so this only applies on Windows.
          CMAKE_GENERATOR_x86_64_pc_windows_msvc: Ninja
          # macOS is ad-hoc signed (bundle.macOS.signingIdentity "-"), not notarized. For Developer ID
          # signing and notarization, add these repository secrets and uncomment. APPLE_SIGNING_IDENTITY
          # overrides the "-" in tauri.conf.json.
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: ${{ matrix.args }}

      # The ggml CPU baseline (.cargo/config.toml) must reach CMake, or ggml was built for this
      # runner's CPU.
      - name: Check ggml CPU baseline
        shell: bash
        run: |
          shopt -s nullglob
          caches=(src-tauri/${{ matrix.target-dir }}/{,*/}release/build/whisper-rs-sys-*/out/build/CMakeCache.txt)
          if [ ${#caches[@]} -eq 0 ]; then echo "::error::No whisper-rs-sys CMakeCache.txt"; exit 1; fi
          for f in "${caches[@]}"; do
            echo "$f"
            grep -E '^GGML_(NATIVE|AVX2|FMA|F16C|BMI2|AVX512)[:=]' "$f" || true
            grep -q '^GGML_NATIVE:[A-Z]*=OFF' "$f" || { echo "::error::GGML_NATIVE is not OFF in $f"; exit 1; }
            grep -q '^GGML_AVX2:[A-Z]*=ON' "$f" || { echo "::error::GGML_AVX2 is not ON in $f"; exit 1; }
            grep -q '^GGML_AVX512:[A-Z]*=OFF' "$f" || { echo "::error::GGML_AVX512 is not OFF in $f"; exit 1; }
          done

      # The worker is this exe, and llama-server (tauri-build copies the sidecar next to it). AVX-512
      # from an AVX-512 runner dies on most office PCs. Today no Rust dependency in the exe dispatches to
      # AVX-512 at run time (crc32fast and simd-adler32 have such code but come in only through a
      # proc-macro). If one is added, this step fails on a good build: then check only whisper-rs-sys's
      # ggml-cpu.lib. llama-server links the C runtime statically; if its memcpy or the STL ever
      # dispatches to AVX-512, check only llama.cpp's ggml-cpu.lib the same way. findstr exits 1 when
      # nothing matches, hence exit 0.
      - name: Check for AVX-512 instructions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($name in 'meeting-summarizer.exe', 'llama-server.exe') {
            $exe = "$env:CARGO_TARGET_DIR\release\$name"
            if (-not (Test-Path $exe)) { echo "::error::$exe not found"; exit 1 }
            dumpbin /nologo /disasm:nobytes /out:disasm.txt $exe
            if ($LASTEXITCODE) { echo "::error::dumpbin failed"; exit 1 }
            $zmm = findstr /r "zmm[0-9]" disasm.txt
            if ($zmm) {
              $zmm | Select-Object -First 20
              echo "::error::AVX-512 (zmm) instructions in $exe"
              exit 1
            }
          }
          exit 0

      # The sidecar is in the app and the dmg, signed by the bundler (ad-hoc, hardened runtime, like the
      # app), and links only system libraries: nothing from Homebrew or the build machine.
      - name: Check the llama-server sidecar (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bundle=src-tauri/target/aarch64-apple-darwin/release/bundle
          app=$bundle/macos/meeting-summarizer.app
          bin=$app/Contents/MacOS/llama-server
          test -s "$bin" || { echo "::error::$bin is missing or empty"; exit 1; }
          otool -L "$bin"
          other=$(otool -L "$bin" | tail -n +2 | awk '{print $1}' | grep -vE '^(/usr/lib/|/System/)' || true)
          if [ -n "$other" ]; then echo "::error::llama-server links non-system libraries: $other"; exit 1; fi
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$bin" 2>&1 | grep -E '^(Identifier|CodeDirectory|Signature)'
          codesign -dv "$bin" 2>&1 | grep -q 'flags=.*runtime' || { echo "::error::llama-server is not signed with the hardened runtime"; exit 1; }
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$(ls "$bundle"/dmg/*.dmg)" >/dev/null
          found=$(test -s "$mnt/meeting-summarizer.app/Contents/MacOS/llama-server" && echo yes || true)
          hdiutil detach "$mnt" >/dev/null
          [ -n "$found" ] || { echo "::error::llama-server is not in the dmg"; exit 1; }

      # The sidecar needs only Windows DLLs and vulkan-1.dll: the C runtime is static
      # (CMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded), so no VCRUNTIME140.dll or other redistributable.
      # VC++ redistributable DLLs are in a runner's System32, hence the name check. In the installer it
      # sits in one folder with the app and vulkan-1.dll, where Windows finds the DLL (ENG9).
      - name: Check the llama-server sidecar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "$env:CARGO_TARGET_DIR\release\llama-server.exe"
          $deps = dumpbin /nologo /dependents $exe | Select-String '^\s+(\S+\.dll)$' | ForEach-Object { $_.Matches[0].Groups[1].Value }
          if ($LASTEXITCODE -or -not $deps) { echo "::error::dumpbin /dependents failed for $exe"; exit 1 }
          $deps
          $bad = $deps | Where-Object { $_ -ne 'vulkan-1.dll' -and ($_ -match '^(vcruntime|msvcp|vcomp|concrt|api-ms-win-crt-)' -or -not (Test-Path "$env:SystemRoot\System32\$_")) }
          if ($bad) { echo "::error::llama-server.exe needs DLLs Windows does not have: $($bad -join ', ')"; exit 1 }
          $setup = (Get-ChildItem "$env:CARGO_TARGET_DIR\release\bundle\nsis\*-setup.exe")[0].FullName
          $paths = 7z l -ba -slt $setup | Select-String '^Path = (.+)$' | ForEach-Object { $_.Matches[0].Groups[1].Value }
          $dirs = foreach ($name in 'meeting-summarizer.exe', 'llama-server.exe', 'vulkan-1.dll') {
            $path = $paths | Where-Object { (Split-Path $_ -Leaf) -eq $name } | Select-Object -First 1
            if (-not $path) { $paths; echo "::error::$name is not in $setup"; exit 1 }
            "$path -> '$(Split-Path $path -Parent)'" | Write-Host
            Split-Path $path -Parent
          }
          if (@($dirs | Select-Object -Unique).Count -ne 1) { echo "::error::app, llama-server.exe and vulkan-1.dll are not in one folder"; exit 1 }
          exit 0

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: meeting-summarizer-${{ matrix.name }}
          # Absolute on Windows: upload-artifact rejects `..` in paths.
          path: ${{ env.CARGO_TARGET_DIR || 'src-tauri/target' }}/${{ matrix.installer }}
          if-no-files-found: error
          retention-days: 30

  # A v* tag, once both builds and every check above pass: a GitHub Release with both installers, so
  # the repository's front page links to them and they outlive the 30-day artifacts. The notes are
  # docs/releases/<tag>.md, else GitHub's generated ones. A tag moved and built again replaces the
  # files of its release.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: installers
          merge-multiple: true

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l installers
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" installers/* --clobber
            exit 0
          fi
          notes="docs/releases/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release create "$GITHUB_REF_NAME" installers/* --verify-tag --title "$GITHUB_REF_NAME" "$@"
