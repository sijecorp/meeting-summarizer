[package]
name = "meeting-summarizer"
version = "1.0.3"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "meeting_summarizer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# The llama-server stamp check hashes scripts/llama-server.flags (build.rs). Same version as below.
sha2 = "0.10.9"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
# The file picker for importing a model file (ONB-02).
tauri-plugin-dialog = "2.8.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2.5.3"
keyring = "4.2.0"
# `parsing`: the meeting start for the Slack header (slack.rs).
time = { version = "0.3", features = ["parsing"] }
cpal = "0.18.2"
hound = "3.5.1"
rubato = "5.0.1"
# The recording screen's spectrum. Same version rubato already pulls in.
realfft = "3.5.0"
# Manual upload (REC-12): mp3, m4a/mp4 (AAC), wav, flac and ogg, decoded in pure Rust. MPL-2.0.
symphonia = { version = "0.5.5", default-features = false, features = ["wav", "pcm", "adpcm", "mp3", "aac", "isomp4", "flac", "ogg", "vorbis"] }
rtrb = "0.4.0"
keepawake = "0.6.1"
# Pinned (M0 exit condition): bundles whisper.cpp 1.8.3 with the built-in Silero VAD. Building it
# needs cmake. GPU features are per target below (architecture 5.4).
whisper-rs = "0.16.0"
# ggml's device list for picking the GPU (plan 5.1-8): whisper-rs re-exports it only with `raw-api`.
# The version whisper-rs pins, so both are one crate.
whisper-rs-sys = "=0.15.0"
# Model hashes. Same version the tree already has.
sha2 = "0.10.9"
# The bench's CER compares NFC text (plan 5.1-14). The version and data idna already pull in.
icu_normalizer = { version = "2.3.0", default-features = false, features = ["compiled_data"] }
# Model download, LLM and Slack. The OS TLS stack and certificate store, so a company mirror
# with an in-house CA just works; system-proxy for company proxies.
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "system-proxy"] }
# APP-03. 2.6.0 is the first to report desktop notification clicks (`Notification::on_action`).
tauri-plugin-notification = "2.7.0"
# The app log (`app.log` in `app_log_dir()`): Windows release builds have no stderr. `log` is the
# version the tree already has. `RotationStrategy::KeepSome` needs plugin-log 2.5.
tauri-plugin-log = "2.10.1"
log = "0.4.34"
# The summary engine's per-summary API key (sidecar.rs). Same version tauri already pulls in.
getrandom = "0.3.4"
# Slack sign-in (slack.rs): PKCE's base64url and the Web API's form bodies. The versions reqwest
# already pulls in.
base64 = "0.23.1"
form_urlencoded = "1.2.2"


# Model hashes in dev builds and tests: unoptimized sha2 runs at ~30 MB/s, so checking the 874 MB
# model took about half a minute.
[profile.dev.package.sha2]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
# Same crate keyring 4 wraps: its attributes-only search lets `has_secret` skip decrypting (9.2).
# Keep this in lockstep with the keyring-core version keyring depends on: both must resolve to one
# crate so they share the default credential store (`cargo tree -d` must not list keyring-core).
keyring-core = "1.0.1"
# System audio through our own Core Audio tap (architecture 4.3); clocks and disk space via libc.
# Same versions cpal resolves to, so nothing is duplicated.
libc = "0.2.190"
objc2 = "0.6.5"
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-foundation"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFDictionary", "CFNumber", "CFString"] }
# NSBundle, NSUserNotification: clearing our delivered notifications when the window gains focus
# (architecture 11.1).
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSBundle", "NSString", "NSUUID", "NSUserNotification", "NSValue"] }
whisper-rs = { version = "0.16.0", features = ["metal"] }

[target."cfg(windows)".dependencies]
# Needs the Vulkan SDK (VULKAN_SDK) to build and ships vulkan-1.dll next to the app (architecture 5.4).
whisper-rs = { version = "0.16.0", features = ["vulkan"] }
# Reference clocks and disk space (architecture 4.2, 4.6); for the summary engine (sidecar.rs) its
# kill-on-close Job Object (whose functions and limits structs also need Security and Threading),
# the supervisor's error mode (Diagnostics_Debug), EcoQoS (Threading), the power state (Power) and
# the bench's physical core count (SystemInformation). Same version tauri already pulls in.
windows-sys = { version = "0.61.2", features = ["Win32_System_WindowsProgramming", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_Security", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_System_Power", "Win32_System_SystemInformation"] }

[dev-dependencies]
tempfile = "3.27.0"
# The mock runtime, so the queue's state-writing path runs in tests without a window.
tauri = { version = "2", features = ["test"] }
